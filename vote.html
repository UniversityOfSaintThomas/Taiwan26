<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1736">
<title>Vote · AI Divide, Trust, and Governance</title>
<script>
/* Optional: paste the same databaseURL here as in index.html.
   Not required when people arrive by scanning the QR code on the slides. */
const CONFIG = { databaseURL: "", session: "main" };
</script>
<style>
*{box-sizing:border-box}
html{background:#0b1736}
body{margin:0;color:#fff;font-family:Arial,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;background:linear-gradient(#0b1736,#0e2147) fixed;min-height:100vh;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px 60px}
header{font-size:13px;color:#aeb9d6;display:flex;justify-content:space-between;gap:10px;padding:4px 2px 12px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin:0 -16px;padding-left:16px;padding-right:16px}
nav button{flex:none;border:1.5px solid #ffffff44;background:none;color:#fff;border-radius:999px;padding:9px 14px;font-size:14px;line-height:1.2}
nav button.on{background:#f5c542;border-color:#f5c542;color:#0b1736;font-weight:700}
nav button.live:after{content:"●";color:#3ddc84;margin-left:6px}
h1{font-size:22px;margin:6px 0 2px}h1+p{margin:0 0 16px;color:#f5c542;font-size:19px;font-weight:700}
.q{border:2px solid #f5c542;border-radius:18px;padding:16px;margin-bottom:18px;background:#0a143099}
.q:nth-of-type(2){border-color:#2bb5e0}
.q h2{font-size:18px;margin:0 0 4px;line-height:1.3}.q h2 b{color:#f5c542}.q:nth-of-type(2) h2 b{color:#2bb5e0}
.q .z{font-size:16px;color:#e2e8f5;margin-bottom:12px;line-height:1.35}
.o{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#ffffff0f;border:2px solid #ffffff33;color:#fff;border-radius:14px;padding:12px;margin-top:10px;font:inherit;min-height:62px}
.o span{flex:none;width:34px;height:34px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-weight:700}
.o b{display:block;font-size:17px}.o i{display:block;font-style:normal;font-size:15px;color:#dfe6f5;margin-top:2px}
.o.sel{background:#f5c542;border-color:#f5c542;color:#0b1736}.o.sel i{color:#3b3210}.o.sel span{background:#0b1736;color:#f5c542}
.ok{font-size:14px;color:#3ddc84;margin-top:10px;min-height:18px}
.ok.err{color:#ff8a80}
textarea,input[type=text]{width:100%;border-radius:12px;border:0;padding:14px;font:inherit;font-size:17px;color:#111;margin-top:6px}
.send{margin-top:12px;width:100%;background:#f5c542;color:#0b1736;border:0;border-radius:999px;padding:14px;font:inherit;font-size:17px;font-weight:700}
.send:disabled{opacity:.5}
.note{font-size:13px;color:#aeb9d6;line-height:1.5;margin-top:22px}
.big{font-size:18px;line-height:1.5;padding:30px 6px;text-align:center}
</style>
</head>
<body>
<main>
<header><span>AI Divide, Trust, and Governance · 高等教育中的AI落差、信任與治理</span></header>
<nav id="nav"></nav>
<div id="view"></div>
<p class="note">Anonymous: no name, email or account is collected. You can change an answer by tapping another option.<br>匿名投票：不會收集姓名、電子郵件或帳號。點選其他選項即可更改答案。</p>
</main>
<script>
const POLLS=[{"id":"warm","slide":3,"type":"poll","title":"Warm-Up: Quick Poll","zh":"暖身投票","qs":[{"id":"w1","q":"How often did you use AI for schoolwork this past week?","zh":"過去一週，你多常使用AI完成工作或課業？","opts":[["Not at all","完全沒有"],["Once or twice","一兩次"],["Most days","大部分的日子"],["Every day","每天"]]},{"id":"w2","q":"When an AI gives you an answer, you usually…","zh":"當AI給你答案時，你通常會…","opts":[["Trust it as is","直接相信"],["Check it sometimes","有時查證"],["Always verify it","一定查證"],["Avoid using AI","不使用AI"]]}]},{"id":"lead","slide":20,"type":"poll","title":"Poll: If You Led the University…","zh":"投票：如果由你帶領大學…","qs":[{"id":"g1","q":"Which approach to AI should your university take?","zh":"你的大學應該採取哪一種AI政策？","opts":[["Ban AI and use detectors","禁止AI並使用偵測軟體"],["Let each instructor decide","由每位教師自行決定"],["Campus guidelines with options","全校指引，提供多種選項"],["Co-design rules with students","與學生共同制定規範"]]},{"id":"g2","q":"Should AI-detector scores count as evidence of cheating?","zh":"AI偵測分數可以作為作弊的證據嗎？","opts":[["Yes, as proof","可以，作為證據"],["Only to start a conversation","只能作為對話的起點"],["No, never","不行，絕對不可以"],["Not sure","不確定"]]}]},{"id":"close","slide":34,"type":"poll","title":"Closing Poll: Who Decides?","zh":"結語投票：由誰決定？","qs":[{"id":"c1","q":"Who should write the AI rules at your university?","zh":"誰應該制定你學校的AI規範？","opts":[["University leaders","學校行政主管"],["Faculty","教師"],["Students","學生"],["All of us, together","大家共同制定"]]},{"id":"c2","q":"After today, I will…","zh":"今天之後，我會…","opts":[["Verify AI outputs","查證AI的產出"],["Disclose my AI use","揭露我的AI使用"],["Ask for training or licensed tools","爭取訓練或授權工具"],["Join the policy conversation","參與政策討論"]]}]},{"id":"words","slide":35,"type":"words","title":"Closing Poll: Your Concerns","zh":"結語投票：你的擔憂","q":"What is your biggest concern about AI in your education?","qzh":"你對AI在學習或教育中最大的擔憂是什麼？","hint":"Answer in a word or short phrase.","hintzh":"請用一個詞或一句話回答。"},{"id":"qa","slide":36,"type":"qa","title":"Questions & Discussion","zh":"問答與討論","q":"What surprised you? What would you change at your university?","qzh":"哪些內容讓你驚訝？你會想改變你學校的哪些做法？","hint":"Type your question for the speaker.","hintzh":"請輸入你想問講者的問題。"}];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qs=new URLSearchParams(location.search);
const clean=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
const normDb=u=>{u=String(u||'').trim().replace(/\/+$/,'');if(!u)return'';if(!/^https?:\/\//.test(u))u='https://'+u;return u};
const S=clean(qs.get('s'))||clean(CONFIG.session)||'main';
const DB=normDb(qs.get('db')||CONFIG.databaseURL);
const KEY='aidv.v.'+S;
let st={};try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
st.dev=st.dev||'d'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);st.votes=st.votes||{};st.tag=st.tag||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};save();
const req=(p,m,b)=>fetch(`${DB}/aidivide/${S}/${p}.json`,{method:m||'GET',body:b===undefined?undefined:JSON.stringify(b)}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
const NAMES={warm:'Warm-up 暖身',lead:'If you led 如果由你帶領',close:'Closing 結語',words:'Your concern 你的擔憂',qa:'Q&A 提問'};
let view=qs.get('p')||'warm',live=null,picked=false;

function nav(){$('#nav').innerHTML=POLLS.map(p=>`<button data-p="${p.id}" class="${p.id===view?'on':''} ${p.id===live?'live':''}">${NAMES[p.id]}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.p;picked=true;show()});const on=$('#nav .on');on&&on.scrollIntoView({inline:'center',block:'nearest'})}
function show(){
  nav();const p=POLLS.find(x=>x.id===view)||POLLS[0],v=$('#view');
  if(!DB){v.innerHTML='<p class="big">Voting is not open yet. Please scan the QR code on the screen.<br>投票尚未開放，請掃描螢幕上的QR碼。</p>';return}
  let h=`<h1>${esc(p.title)}</h1><p>${esc(p.zh)}</p>`;
  if(p.type==='poll'){
    h+=p.qs.map((q,k)=>`<section class="q"><h2><b>Q${k+1}.</b> ${esc(q.q)}</h2><div class="z">${esc(q.zh)}</div>`+q.opts.map((o,i)=>`<button class="o ${st.votes[q.id]===i?'sel':''}" data-q="${q.id}" data-i="${i}"><span>${i+1}</span><div><b>${esc(o[0])}</b><i>${esc(o[1])}</i></div></button>`).join('')+`<div class="ok" id="ok-${q.id}">${st.votes[q.id]!=null?'✓ Vote recorded 已記錄':''}</div></section>`).join('');
    v.innerHTML=h;
    v.querySelectorAll('.o').forEach(b=>b.onclick=()=>{const q=b.dataset.q,i=+b.dataset.i,ok=$('#ok-'+q);st.votes[q]=i;save();v.querySelectorAll(`.o[data-q="${q}"]`).forEach(x=>x.classList.toggle('sel',x===b));ok.className='ok';ok.textContent='Sending… 傳送中';
      req(`votes/${q}/${st.dev}`,'PUT',i).then(()=>{ok.textContent='✓ Vote recorded 已記錄'}).catch(()=>{ok.className='ok err';ok.textContent='Could not send. Tap again. 傳送失敗，請再點一次。'})});
  }else if(p.type==='words'){
    h+=`<section class="q"><h2>${esc(p.q)}</h2><div class="z">${esc(p.qzh)}<br>${esc(p.hint)} ${esc(p.hintzh)}</div><input type="text" id="w" maxlength="40" value="${esc(st.word||'')}" placeholder="One word or short phrase 一個詞或一句話"><button class="send" id="ws">${st.word?'Update 更新':'Send 送出'}</button><div class="ok" id="wok">${st.word?'✓ Received 已收到':''}</div></section>`;
    v.innerHTML=h;
    $('#ws').onclick=()=>{const t=$('#w').value.trim().replace(/\s+/g,' ').slice(0,40);if(!t)return;const ok=$('#wok');ok.className='ok';ok.textContent='Sending… 傳送中';req('words/'+st.dev,'PUT',t).then(()=>{st.word=t;save();ok.textContent='✓ Received 已收到';$('#ws').textContent='Update 更新'}).catch(()=>{ok.className='ok err';ok.textContent='Could not send. Try again. 傳送失敗，請再試一次。'})};
  }else{
    h+=`<section class="q"><h2>${esc(p.hint)}</h2><div class="z">${esc(p.hintzh)}</div><textarea id="t" rows="4" maxlength="280" placeholder="Your question 你的問題"></textarea><button class="send" id="ts">Send question 送出問題</button><div class="ok" id="tok"></div></section>`;
    v.innerHTML=h;
    $('#ts').onclick=()=>{const t=$('#t').value.trim().slice(0,280);if(!t)return;const ok=$('#tok'),b=$('#ts');b.disabled=true;ok.className='ok';ok.textContent='Sending… 傳送中';req('qa','POST',{t,ts:Date.now()}).then(()=>{$('#t').value='';ok.textContent='✓ Sent. You can ask another. 已送出，可以再問一題。'}).catch(()=>{ok.className='ok err';ok.textContent='Could not send. Try again. 傳送失敗，請再試一次。'}).finally(()=>{b.disabled=false})};
  }
}
/* follow the presenter: which poll is live, and whether results were reset */
async function sync(){
  if(!DB||document.hidden)return;let m;try{m=(await req('meta'))||{}}catch(e){return}
  let changed=false;const pe=m.pe||{};
  POLLS.forEach(p=>{const tag=(m.epoch||0)+':'+(pe[p.id]||0);if(st.tag[p.id]!==undefined&&st.tag[p.id]!==tag){if(p.type==='poll')p.qs.forEach(q=>{delete st.votes[q.id]});if(p.type==='words')delete st.word;changed=true}st.tag[p.id]=tag});save();
  const typing=/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||'')&&document.activeElement.value;
  if(m.live&&m.live!==live){live=m.live;if(!typing){view=live;changed=true}else nav()}
  if(changed&&!typing)show();
}
show();sync();setInterval(sync,7000+Math.random()*3000);document.addEventListener('visibilitychange',sync);
</script>
</body>
</html>
