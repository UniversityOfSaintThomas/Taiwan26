var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {

cant-out-design-or-out-run-ai/", 5.49, 63.14, 26.01, 2.0], ["https://doi.org/10.1038/s41591-020-1034-x", 25.03, 74.29, 22.74, 2.0], ["https://doi.org/10.1080/13562517.2024.2341005", 58.58, 19.4, 25.68, 2.0], ["https://doi.org/10.1016/j.caeai.2025.100383", 68.92, 30.55, 23.14, 2.0], ["https://web.mit.edu/files/AI-Committee-Final-Report.pdf", 52.58, 41.7, 29.27, 2.0], ["https://doi.org/10.3389/fcomp.2026.1759027", 52.58, 50.29, 23.62, 2.0], ["https://unesdoc.unesco.org/ark:/48223/pf0000386693", 58.38, 56.33, 28.48, 2.0], ["https://doi.org/10.54675/JKJB9835", 52.58, 62.36, 18.48, 2.0], ["https://www.hhs.gov/ohrp/regulations-and-policy/belmont-report/read-the-belmont-report/index.html", 52.58, 73.51, 43.56, 2.0], ["https://www.hhs.gov/ohrp/regulations-and-policy/belmont-report/read-the-belmont-report/index.html", 52.58, 75.64, 9.0, 2.0], ["https://ctld.site.nthu.edu.tw/p/450-1217-253458,c0.php?Lang=zh-tw", 52.58, 86.79, 35.92, 2.0]], "39": [["https://www.nbcnews.com/politics/politics-news/bill-gates-ai-companies-self-regulating-governments-monitoring-rcna599619", 5.49, 19.71, 43.74, 2.0], ["https://www.nbcnews.com/politics/politics-news/bill-gates-ai-companies-self-regulating-governments-monitoring-rcna599619", 5.49, 21.84, 22.07, 2.0], ["https://www.fortune.com/2026/09/09/anthropic-researcher-resigns-warn-ai-companies-gambling-with-lives/", 5.49, 30.43, 43.22, 2.0], ["https://www.fortune.com/2026/09/09/anthropic-researcher-resigns-warn-ai-companies-gambling-with-lives/", 5.49, 32.56, 13.21, 2.0], ["https://doi.org/10.48550/arXiv.2506.09160", 19.67, 38.6, 22.32, 2.0], ["https://doi.org/10.1177/00187208251401773", 5.49, 47.19, 23.59, 2.0], ["https://universityofsaintthomas.github.io/ai-survey-evidence/", 5.49, 53.23, 31.81, 2.0], ["https://technews.tw/2024/12/28/geoffrey-hinton-says-there-is-10-to-20-percent-chance-ai-will-lead-to-human-extinction-in-three-decades/", 5.49, 61.82, 43.79, 2.0], ["https://technews.tw/2024/12/28/geoffrey-hinton-says-there-is-10-to-20-percent-chance-ai-will-lead-to-human-extinction-in-three-decades/", 5.49, 63.95, 28.74, 1.84], ["https://youtu.be/UG_X_7g63rY", 5.49, 69.99, 16.41, 2.0], ["https://udn.com/news/story/7238/9220471", 5.49, 78.58, 22.34, 2.0], ["https://teaching.uchicago.edu/resources/programming-and-resources-ai", 52.58, 19.71, 38.08, 2.0], ["https://www.sydney.edu.au/news-opinion/news/2024/11/27/university-of-sydney-ai-assessment-policy.html", 52.58, 28.3, 43.77, 2.0], ["https://www.sydney.edu.au/news-opinion/news/2024/11/27/university-of-sydney-ai-assessment-policy.html", 52.58, 30.43, 12.44, 2.0], ["https://doi.org/10.1016/j.poetic.2006.05.004", 67.31, 42.5, 23.14, 2.0], ["https://doi.org/10.52783/jisem.v10i21s.3327", 52.58, 53.65, 23.28, 2.0], ["https://doi.org/10.1007/s40593-024-00433-x", 52.58, 67.36, 23.42, 2.0], ["https://doi.org/10.1108/JME-08-2025-0178", 67.52, 75.95, 22.52, 2.0]]}, "notes": {"1": "[~1 min] Good morning, everyone. 大家好。Thank you for the invitation to be here in Taiwan.\n\nToday's talk connects three ideas: the AI divide, trust, and governance. You will hear a lot about what universities should do. But many of you are AI users every day, and many of you are designing studies on AI in teaching and learning. So I will also ask what responsibility each of us carries, as users and as researchers.\n\nTransition: First, let me tell you a little about who I am and why I care about this topic.", "2": "[~1 min] Briefly introduce yourself. Professor and Ed.D. program director at the University of St. Thomas in Minnesota; co-director of our new M.A. in Collaborative Intelligence; chair of the Pedagogy Working Group at our Institute for AI for the Common Good; Fulbright Senior Scholar.\n\nWhy this matters to me: I sit between three worlds. I lead a doctoral program, I help design AI policy, and I study survey data from our own campus. That is the lens I bring today.\n\nTransition: Before we start, let's find out how you use AI.", "3": "[~2–3 min] Ask the audience to scan the code and vote. Read both questions aloud in English and Mandarin.\n\nWhile results come in, say: There is no right answer. I will come back to Question 2 when we talk about trust, because \"trust it as is\" and \"always verify\" are two very different habits.\n\nComment on the pattern you see. For example: \"Most of you use AI weekly or more, but fewer of you always verify. Keep that gap in mind.\"\n\nTransition: Your answers are local, but the debate is global.", "4": "[~1 min] Read the headline: the debate is global, but the fallout is local.\n\nKey line: AI governance in higher education is not about controlling technology. It is about managing human practices in the face of rapid change.\n\nPoint out that this is the thread for the whole talk: every slide comes back to what people decide, not what the tool does.\n\nTransition: Here is our route for today.", "5": "[~1 min] Four stops: the divide (who has access, skills, and benefits), trust (too much, too little, or calibrated), governance (who decides and how), and evidence from two years of University of St. Thomas surveys.\n\nAdd: At the end, I will turn the lens on you, on your responsibility as AI users and as researchers who study AI in teaching and learning.\n\nTransition: Let's begin with the divide.", "6": "[~15 sec] Section 1: The Divide. Ask the question on the slide: who has access, who has the skills, and who actually benefits?", "7": "[~2 min] Tell the story. Mei has a paid AI plan, a fast laptop, and friends who share prompts; she finishes in 20 minutes. Jun commutes 90 minutes, uses a free app on his phone with weak Wi-Fi, and hits the daily limit.\n\nSame course, same deadline, different realities.\n\nAsk: Which situation feels closer to yours, or to students you know? Note that these are composite, illustrative students, not real individuals.\n\nTransition: And the gap is no longer just about access.", "8": "[~1.5 min] The divide has moved from \"having an account\" to \"having capability.\" One student has an autonomous, paid AI tutor that anticipates gaps; another struggles with limits, connectivity, and hallucinated facts.\n\nEmphasize the last line: the students who need AI most are often the ones concluding that \"AI is not for people like me.\"\n\nTransition: Capability gaps are not only about money. They are also built into the technology.", "9": "[~2.5 min] Joy Buolamwini calls algorithmic bias the \"coded gaze.\" Her own story: face-detection software could not see her face until she put on a white mask.\n\nEvidence: In Gender Shades (Buolamwini & Gebru, 2018), commercial gender classifiers had error rates up to 34.7% for darker-skinned women versus 0.8% for lighter-skinned men.\n\nStakes rise when the same tools are used in policing, hiring, and lending. Her remedy, \"incoding,\" asks who codes, how we code, and why we code.\n\nOptional: play a short clip of the TED talk (8:46) if time allows.\n\nEthics hook: Bias is not only a technical bug; it is a human responsibility. I will return to this when we talk about your role as users and researchers.\n\nTransition: Now let's see how these gaps stack up.", "10": "[~1.5 min] Van Dijk's model, updated for AI: the divide climbs from access (devices, connectivity, paid licenses), to skills (AI literacy, critical thinking, precise prompting), to outcomes (who actually gains academically).\n\nHodøl, Kjærgård & Økland (2025) describe this shift \"from access to ability.\" Matjie et al. (2026) show the same pattern in AI and education.\n\nKey point: those facing systemic barriers often lack the digital confidence to use AI well, even when they have access.\n\nTransition: Let's look more closely at digital confidence.", "11": "[~2 min] Bentley et al. (2024) found that digital exclusion spills over into AI: digital confidence moderates the link between everyday AI experiences and attitudes toward AI.\n\nGroups reporting lower digital confidence: women, older adults, people on lower salaries, people with less digital access, and people with lower digital well-being.\n\nLocal connection: AI tools often under-represent Traditional Chinese, Taiwanese, and Indigenous languages and local knowledge (Vesna et al., 2025). Ask: Have you noticed this in the tools you use?\n\nTransition: The divide shapes experience, and experience shapes trust.", "12": "[~15 sec] Section 2: Trust. The question: who is trusted, the tool or the person?", "13": "[~2 min] Two scenarios.\n2a, too much trust: Yu-Ting asks a chatbot for sources, gets three perfect-looking citations, and submits without checking. The librarian finds none of them.\n2b, too little trust: Prof. Lin runs Kai's essay through a detector: 87% \"AI-generated.\" Kai wrote every word; English is his second language.\n\nAsk the question on the slide: Whom should the professor trust, the tool or the student? Give the audience 30 seconds to discuss with a neighbor.\n\nNote: both scenarios are illustrative.\n\nTransition: Both are failures of calibration.", "14": "[~1.5 min] Over-trust means accepting fluent answers without checking (Scenario 2a). Under-trust means distrusting both the tool and the student, often out of fear or a lack of control (2b). Calibrated trust matches what AI can actually do: willingness to rely on it, with verification.\n\nKey insight: trust and distrust are distinct; a person can hold both at once. Trust grows with experience, frequency, and proficiency, not demographics (Pitts & Motamedi, 2025; Safarov et al., 2026; Lyu et al., 2025; Viberg et al., 2025; Đerić et al., 2025).\n\nLink back to the warm-up poll Question 2.\n\nTransition: If experience matters, then how we teach with AI matters.", "15": "[~2 min] Li, Cui & Hagedorn (2026) reviewed studies on ChatGPT and critical and creative thinking. Their core finding: \"The most consistent divider was not the presence of ChatGPT but the instructional ecology surrounding it.\"\n\nScaffolded use (reflective prompts, rubrics, verification) is linked to gains in critical and creative thinking. Unstructured use invites premature closure, cognitive offloading, and weaker critical thinking.\n\nNote for researchers in the room: this means \"AI versus no AI\" is rarely the right comparison. The design of the learning activity is part of the treatment.\n\nTransition: Scaffolding requires transparency, from both sides.", "16": "[~2 min] This slide combines two earlier slides on transparency.\n\nTwo loops. On the student side: declare AI use, share chat logs, and explain revisions. On the faculty side: declare how AI is used to grade, assess, or build course materials.\n\nEvidence from students: Luo (2025) interviewed university students and found an absence of \"two-way transparency.\" Students had to declare AI use and sometimes submit chat records, but how teachers graded AI-assisted work stayed unclear. The result was a low-trust climate where students felt unsafe exploring AI.\n\nEvidence from teachers: Feldman-Maggor et al. (2025) found that teachers' trust and acceptance of AI recommendations rose when explanations were domain-specific rather than data-driven. People trust what they can understand.\n\nTakeaway: one-way rules create a low-trust climate. Transparency builds trust in both directions.\n\nTransition: So who sets these rules? That brings us to governance.", "17": "[~15 sec] Section 3: Governance. Who decides the rules, and how?", "18": "[~3 min] The people building AI do not agree on its risks. That disagreement is itself a reason universities must govern.\n\nDario Amodei, Anthropic CEO, told 60 Minutes (CBS, November 2025) he is \"deeply uncomfortable\" with these decisions being made \"by a few companies, by a few people.\" In his June 2026 essay, Policy on the AI Exponential, he argued transparency alone is no longer enough and called for binding testing of frontier models.\nJacob Coxon, a former Anthropic and OpenAI pretraining researcher, resigned in September 2026, writing that the labs are \"gambling with our lives\" (Fortune, Sept. 9, 2026). Note: his claims drew wide attention and some commentators questioned his ties to AI-safety advocacy groups, so present him as one voice in the debate.\n\nJensen Huang, NVIDIA CEO, is the dissent. He told CBS News (Sept. 2026) there is a \"0% chance\" AI ends the world by 2030, called such warnings \"irresponsible,\" and said existing laws are enough. Yet he also said companies should never ship products before they are ready.\n\nGeoffrey Hinton, 2024 Nobel laureate, left Google in 2023 to speak freely (NPR). On BBC Radio 4 in December 2024 he estimated a 10%–20% chance that AI leads to human extinction within 30 years (reported by The Guardian and TechNews 科技新報).\n\nBill Gates told NBC's Meet the Press (aired Sept. 27, 2026): \"No one thinks self-regulation is enough,\" calling for required safeguards and monitoring.\n\nTakeaway: when even the builders disagree, universities cannot outsource governance to industry.\n\nSources (all linked on the slide and in References):\ncbsnews.com/news/anthropic-ceo-dario-amodei-warning-of-ai-potential-dangers-60-minutes-transcript\ndarioamodei.com/post/policy-on-the-ai-exponential\nfortune.com/2026/09/09/anthropic-researcher-resigns-warn-ai-companies-gambling-with-lives\ncbsnews.com/news/jensen-huang-nvidia-rejects-ai-extinction-warnings\nnpr.org/2023/05/28/1178673070\ntechnews.tw/2024/12/28/geoffrey-hinton-says-there-is-10-to-20-percent-chance-ai-will-lead-to-human-extinction-in-three-decades\nnbcnews.com/politics/politics-news/bill-gates-ai-companies-self-regulating-governments-monitoring-rcna599619\n\nTransition: So what does governance look like on a campus?", "19": "[~2 min] Two hypothetical universities.\nUniversity A, control first: bans AI, buys detection software, provides no training, and a small committee writes the policy in a month. Result: AI goes underground and trust falls.\nUniversity B, people first: guidelines co-written by students, faculty, and IT; licensed tools for all; regular workshops; revised every year. Result: open conversation and growing skills.\n\nAsk the core question: Is your AI policy teaching students to hide?\n\nTransition: Now it's your turn to lead.", "20": "[~2–3 min] Run the poll. Q1: Which approach should your university take? Q2: Should AI-detector scores count as evidence of cheating?\n\nWhen Q2 results appear, note that Cornell's 2023 committee discouraged automatic detection tools because they are unreliable and cannot provide definitive evidence. Return to Kai's story from the trust section.\n\nTransition: Let's see what real universities chose.", "21": "[~3 min] Six real approaches. Each university name on the slide links to its policy source.\n\nColumbia: default prohibition. Absent a clear statement from the instructor, using generative AI on an assignment or exam is prohibited. The policy comes from the Provost's working group.\nCornell: a 2023 provost committee recommended three options: prohibit, allow with attribution, or encourage. It also discouraged AI detectors.\nHarvard: course-by-course. Faculty set and communicate each course's policy; students must follow each course's rules.\nUChicago: the July 2025 AI and Education Working Group asked academic units to develop their own guidelines; the teaching center frames choices as teaching with, without, and about AI.\nMIT: an ad hoc committee centered on augmenting rather than automating, centering people, and iterating.\nBrown: evidence first. The GAITL committee (report July 2026) gathered feedback from nearly 700 faculty, students, and staff and audited about 3,000 syllabi; more than half had no AI policy. Only then did it move toward a baseline policy. Brown also created an Associate Provost for AI.\n\nAsk: Which model fits your university? Which would you want as a student?\n\nLinks:\nprovost.columbia.edu/content/office-senior-vice-provost/ai-policy\nteaching.cornell.edu/generative-artificial-intelligence/cu-committee-report-generative-artificial-intelligence-education\noue.fas.harvard.edu/faculty-resources/generative-ai-guidance\nteaching.uchicago.edu/resources/programming-and-resources-ai\nweb.mit.edu/files/AI-Committee-Final-Report.pdf\nprovost.brown.edu/sites/default/files/GAITL_Committee_Report_FNL.pdf\n\nTransition: Across these models, some patterns are traps and some are targets.", "22": "[~1.5 min] Bad governance focuses on control and detection, is written in isolation by small closed committees, limits access to those who can afford premium tiers, and is written once and forgotten.\n\nGood governance focuses on capability and AI literacy, includes students, faculty, and staff, provides licensed tools equally, and treats guidelines as living documents reviewed every year.\n\nTransition: Governance also has to reach the most concrete place of all: assessment.", "23": "[~2 min] The University of Sydney's \"two-lane\" approach. Lane 1 (secure): in-person, supervised, assessment OF learning. Lane 2 (open): scaffolded AI use, assessment FOR and AS learning. Their reasoning: bans in unsupervised settings are unenforceable (Liu & Bridgeman, 2023; University of Sydney, 2024).\n\nMIT's committee: augmentation, not automation. Adapt teaching, center people, keep iterating. Theses must disclose AI use, and AI is never an author.\n\nTransition: Now let's look at evidence from my own campus.", "24": "[~15 sec] Section 4: What do two years of campus data tell us?", "25": "[~2.5 min] University of St. Thomas AI surveys, 2025 vs. 2026. Always describe these as survey respondents, not the whole campus.\n\nWeekly-or-more AI use rose in every group of respondents:\nStudent survey respondents: 36.6% (2025) to 50.3% (2026).\nFaculty survey respondents: 33.1% to 58.7%.\nStaff survey respondents: 50.5% to 60.2%.\nStudent respondents: n = 308 in 2025 and n = 919 in 2026.\n\nOther patterns: infrequent users worry more about academic integrity, and concern about environmental impact is rising.\n\nCaveat: different people responded each year and response rates changed, so treat these as trends among respondents, not as estimates for all students, faculty, or staff.\n\nKey insight: experience drives trust. Less access and skill means less experience, which leads to miscalibrated trust and more fear.\n\n[Placeholder: add findings from the open-ended survey responses on divide, trust, or governance once they are coded.]\n\nTransition: Among faculty, the divide is especially sharp.", "26": "[~2 min] Among roughly 295 faculty survey respondents: about 30% were adopters, 45% in between, and 25% skeptics or non-adopters.\n\nThe humanities paradox: AI raises demand for humanities skills like critical analysis and writing, yet skepticism is strongest in the humanities.\n\nThe solution: bridging the \"algorithmic divide\" requires professional development on pedagogical and ethical issues, not just technical clicks (Bian, Ling & Yan, 2024; Lelescu et al., 2025).\n\nTransition: Now test your own intuition about our data.", "27": "[~4–5 min] Ask everyone to open the St. Thomas AI Survey Evidence site, guess each result before it is revealed, and compare their guesses with UST survey respondents. Guesses are stored only in their browser.\n\nDebrief with a neighbor: Which result surprised you most? Take two or three answers from the room.\n\nTransition: Let's put the three themes together.", "28": "[~1.5 min] Divide, trust, and governance are one connected problem.\nLess access and skill means less experience, which leads to miscalibrated trust: fear or over-reliance.\nTrust shapes who adopts the tools and what policies a community will accept.\nGovernance can widen the divide through bans or close it through equitable access, training, and shared voice.\n\nSynthesis: AI governance is about human practices, not the technology itself.\n\nTransition: So what should leaders commit to?", "29": "[~2 min] Four commitments for leaders.\n01 Access for all: fund licensed tools for every student, not just those who can pay.\n02 Ability: embed AI literacy in every discipline.\n03 Calibrated trust: lead visibly, with clear rules on data privacy and transparent grading.\n04 Shared governance: give students a seat at the table and review policies every year.\n\nTransition: Leaders set the conditions. But learning happens in the classroom.", "30": "[~1.5 min] Instructors: redesign assessment with secure and open lanes; scaffold AI use by asking students to verify, justify, and revise; and share exactly how you grade AI-assisted work.\n\nStudents: make an AI learning commitment; disclose use, verify outputs, and protect your own voice; and keep human connection alive by asking peers and teachers first.\n\nTransition: That last column is about you. Let me spend a few minutes on your own responsibility, as AI users and as researchers.", "31": "[~2.5 min] Everything so far could sound like it's the university's job. But you have agency too. AI assists; you are accountable.\n\nAccountability (問責): Whatever AI helps you write, cite, or code, your name is on it. COPE, the Committee on Publication Ethics, says AI tools cannot be listed as authors because they cannot take responsibility for the work. National Tsing Hua University's 2023 guideline, one of the first in Taiwan, asks students and teachers to use AI transparently and responsibly (透明、負責).\n\nJudgment (判斷): UNESCO's AI competency framework for students (2024) puts a human-centred mindset and the ethics of AI at its core. Use AI to extend your thinking, not replace it.\n\nPrivacy and consent (隱私與同意): APA's guidance tells authors not to enter confidential material, such as research data that could identify a participant, into open AI tools.\n\nFairness (公平): Remember the coded gaze. Check outputs for bias, especially for languages and groups that are under-represented, including Traditional Chinese, Taiwanese, and Indigenous languages.\n\nLocal anchor: Taiwan's AI Basic Act, passed in December 2025, lists seven principles, including human autonomy (人類自主) and accountability (問責).\n\nAsk: Which of these four is hardest for you in practice?\n\nTransition: Many of you are also researchers studying AI in teaching and learning. Human agency matters in your research design, too.", "32": "[~3 min] Many of you are running quasi-experimental studies on AI in teaching and learning. In those studies, AI is the treatment, but every design decision is yours.\n\n1. Before the study: ethics review and consent. Tell participants which tool is used and where their data goes, and offer a non-AI path without penalty. This is the Belmont principle of respect for persons.\n\n2. Design: fair comparison. Does the comparison group miss a learning benefit? Consider delayed or wait-list access, which is the Belmont principle of justice. And remember the divide: prior AI experience, paid versus free access, and digital confidence differ between intact classes. Measure them as covariates, or they will confound your results.\n\n3. Implementation: report the AI intervention. Medicine's CONSORT-AI guideline (Liu et al., 2020) asks researchers to describe the AI version, how inputs and outputs were handled, and the human-AI interaction. Adapt that idea: record the tool, version, dates, prompts, and settings. Models are updated mid-semester, which can change your treatment without you noticing.\n\n4. Analysis and writing: measure agency, not just scores. Include over-reliance, verification behavior, and critical thinking; recall the instructional-ecology finding (Li et al., 2026). And disclose any AI you used in coding, analysis, or writing in your Methods section, as APA requires.\n\nKey question for every study: Did AI improve learning, or did it replace the learning you meant to measure?\n\nTransition: Let me close with the question behind this whole talk.", "33": "[~1 min] Read slowly: The question is not whether AI will be used. It is who benefits, who is trusted, and who decides.\n\n問題不在於是否使用AI，而在於誰受益、誰被信任、由誰決定。\n\nAdd: and part of \"who decides\" is you, in how you use AI and how you study it.\n\nTransition: Let's hear your answer.", "34": "[~2 min] Q1: Who should write the AI rules at your university? Q2: After today, I will… verify AI outputs, disclose my AI use, ask for training or licensed tools, or join the policy conversation.\n\nComment on the results, and invite each person to pick one concrete action for this week.", "35": "[~2 min] Ask for one word or a short phrase: What is your biggest concern about AI in your education?\n\nRead a few words from the word cloud aloud and connect them back to the divide, trust, governance, or responsibility.", "36": "[Remaining time] Open for questions. Prompts if the room is quiet: What surprised you? What would you change at your university? For the researchers: how will you handle AI in your next study design?\n\nThank the hosts and audience. 謝謝大家！", "37": "References, part 1 of 3. Every URL on the reference slides is a live link. Mention that the slides will be shared after the talk so the audience can follow up on sources.", "38": "References, part 2 of 3.", "39": "References, part 3 of 3.", "40": "[~20 sec] Model the transparency we have been asking for. Explain how AI tools were used to prepare this talk: Consensus AI for the literature review and for retrieving research articles; Claude and Gemini for slide design, source checking, and drafting speaker notes, and that you reviewed and verified everything and take responsibility for the content. This is the same disclosure we ask of students and researchers."}, "titles": {"1": "AI Divide, Trust, and Governance in Higher Education", "2": "Meet the Speaker | 講者介紹", "3": "Warm-Up: Quick Poll | 暖身投票", "4": "The debate is global.", "5": "Our Journey Today | 今日路線圖", "6": "01", "7": "The Reality of Access | 相同技術，不同現實", "8": "The Evolving Divide: Access Is No Longer Enough", "9": "Algorithmic Bias: The Coded Gaze | 演算法偏見：編碼凝視", "10": "The Escalator of the AI Divide | AI落差的手扶梯", "11": "Digital Confidence Spills Over | 數位自信的延伸效應", "12": "02", "13": "The Trap of Uncalibrated Trust | 信任失準的陷阱", "14": "Calibrating the Human-AI Trust Dial | 校準人機信任的刻度", "15": "The Instructional Ecology of AI | AI 教學法生態系", "16": "Transparency Builds Trust in Both Directions", "17": "03", "18": "Voices of the Frontier: A Divided Debate on Safety", "19": "Two Paths of Institutional Governance | 兩種機構治理途徑", "20": "Poll: If You Led the University… | 投票：如果由你帶領大學…", "21": "The Institutional Governance Matrix | 大學AI治理矩陣", "22": "Governance: The Traps and the Targets | 治理：陷阱與目標", "23": "Rethinking Assessment and Augmentation | 重新思考評量與增強學習", "24": "04", "25": "Campus-Wide Data: The Expanding Gap | 校園數據：持續擴大的落差", "26": "The Faculty Divide: Adopters and Skeptics", "27": "Your Turn: Predict, Then Reveal | 互動時間：先猜，再揭曉", "28": "One Connected Problem | 同一個核心問題", "29": "Four Commitments for Leaders | 領導者的四項承諾", "30": "Rebuilding the Classroom Ecology | 重塑教室生態", "31": "Human Agency: AI Assists, You Are Accountable", "32": "Human Agency in Your Research Design", "33": "Who Decides the Future?", "34": "Closing Poll: Who Decides? | 結語投票：由誰決定？", "35": "Closing Poll: Your Concerns | 結語投票：你的擔憂", "36": "Questions & Discussion  |  問答與討論", "37": "References | 參考文獻", "38": "References (continued) | 參考文獻", "39": "References (continued) | 參考文獻", "40": "AI Use Disclosure | AI使用聲明"}};

function setLocal(path,val){const ks=path?path.split('/'):[];if(!ks.length){tree=val||{};return}let o=tree;for(let i=0;i<ks.length-1;i++){if(!o[ks[i]]||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]]}const k=ks[ks.length-1];if(val==null)delete o[k];else o[k]=val}

    const a=$('#addtxt');if(a)a.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter'&&a.value.trim()){const v=a.value.trim().slice(0,p.type==='qa'?300:60);if(p.type==='words')write('words/m'+rid(),v);else write('qa/m'+rid(),{t:v,ts:Date.now()});a.value=''}};
    sl.querySelectorAll('.opt').forEach(o=>{o.onclick=e=>{if(!tally)return;const q=o.dataset.q,i=+o.dataset.i;if(e.shiftKey){const v=(tree.votes||{})[q]||{};const k=Object.keys(v).find(k=>k[0]==='m'&&v[k]===i);if(k)write(`votes/${q}/${k}`,null)}else write(`votes/${q}/m${rid()}`,i)};o.oncontextmenu=e=>{e.preventDefault();o.onclick({shiftKey:true})}});
    if(p.type==='qa'&&revealed.qa===undefined)revealed.qa=true;

function paint(){
  const p=pollAt(cur);if(!p||SV)return;const rev=!!revealed[p.id];
  const br=$('#bRev');if(!br)return;
  br.textContent=rev?'Hide results':'Show results';br.classList.toggle('on',rev);
  $('#bTal').classList.toggle('on',tally);$('#slide .s').classList.toggle('tally',tally);
  const a=$('#addtxt');if(a)a.style.display=tally?'':'none';
  const c=$('#cnt');
  if(p.type==='poll'){
    const devs=new Set();
    p.qs.forEach(q=>{const v=(tree.votes||{})[q.id]||{};const n=q.opts.map(()=>0);Object.keys(v).forEach(k=>{if(n[v[k]]!==undefined){n[v[k]]++;devs.add(k[0]==='m'?k+q.id:k)}});
      const tot=n.reduce((a,b)=>a+b,0),mx=Math.max(...n);
      n.forEach((x,i)=>{const o=$(`.opt[data-q="${q.id}"][data-i="${i}"]`);const pc=tot?Math.round(x/tot*100):0;o.querySelector('.fill').style.width=rev?pc+'%':'0';o.querySelector('.res').innerHTML=rev?`${pc}%<small>${x} of ${tot}</small>`:'';o.classList.toggle('top',rev&&tot>0&&x===mx)})});
    const per=p.qs.map(q=>Object.keys((tree.votes||{})[q.id]||{}).length);
    c.textContent=Math.max(...per,0);
  }else if(p.type==='words'){
    const w=tree.words||{},keys=Object.keys(w);c.textContent=keys.length;const d=$('#dyn');
    if(!rev){d.className='wait';d.innerHTML=`<div><b>${keys.length}</b>responses so far 則回應<br><span style="font-size:24px">Results appear here as a word cloud 回應將以文字雲呈現</span></div>`;return}
    const m={};keys.forEach(k=>{const t=String(w[k]).trim().replace(/\s+/g,' ');if(!t)return;const n=t.toLowerCase();(m[n]=m[n]||{t,c:0,k:[]}).c++;m[n].k.push(k)});
    const items=Object.values(m),mx=Math.max(1,...items.map(x=>x.c));
    const hash=s=>{let h=0;for(const ch of s)h=(h*31+ch.codePointAt(0))>>>0;return h};
    items.sort((a,b)=>hash(a.t)%97-hash(b.t)%97);
    const base=items.length>40?24:items.length>20?32:items.length>8?42:56,cols=['#ffffff','#f5c542','#7fd4f0','#ffd98a','#bfe9f8'];
    d.className='cloud';d.innerHTML=items.map((x,i)=>`<span data-k="${esc(x.k.join(','))}" title="Click to remove" style="font-size:${Math.round(base*(1+1.4*(mx>1?(x.c-1)/(mx-1):0)))}px;color:${cols[hash(x.t)%cols.length]}">${esc(x.t)}</span>`).join('');
    d.querySelectorAll('span').forEach(s=>s.onclick=()=>s.dataset.k.split(',').forEach(k=>write('words/'+k,null)));
  }else{
    const qa=tree.qa||{},keys=Object.keys(qa).filter(k=>qa[k]&&qa[k].t).sort((a,b)=>(qa[b].ts||0)-(qa[a].ts||0));c.textContent=keys.length;const d=$('#dyn');
    if(!rev){d.className='wait';d.innerHTML=`<div><b>${keys.length}</b>questions received 個提問</div>`;return}
    d.className='qalist';d.innerHTML=keys.length?keys.map(k=>`<div class="qa">${esc(qa[k].t)}<button data-k="${esc(k)}" title="Remove">✕</button></div>`).join(''):'<div class="wait" style="position:static;margin:auto">Questions from the audience appear here<br>觀眾的提問會顯示在這裡</div>';
    d.querySelectorAll('button').forEach(b=>b.onclick=()=>write('qa/'+b.dataset.k,null));
  }
}
function toggleReveal(){const p=pollAt(cur);if(!p)return;revealed[p.id]=!revealed[p.id];paint()}
function resetPoll(p){revealed[p.id]=p.type==='qa';if(p.type==='poll')p.qs.forEach(q=>write('votes/'+q.id,null));else write(p.id,null);write('meta/pe/'+p.id,Date.now())}
function resetAll(){revealed={};write('',{meta:{live:(pollAt(cur)||{}).id||'warm',epoch:Date.now()}})}
function go(i,quiet){i=Math.max(1,Math.min(N,i));cur=i;history.replaceState(null,'','#'+i);
  if(SV){svPaint();return}
  build();const p=pollAt(i);if(p){if(((tree.meta||{}).live)!==p.id||!DB)setLocal('meta/live',p.id);if(DB)req('meta/live','PUT',p.id).catch(()=>{});refresh()}
  if(!quiet&&chan)chan.postMessage({i});
}

/* ---------------- layout, navigation ---------------- */
function fit(){const b=$('#stagebox'),k=Math.min(b.clientWidth/1920,b.clientHeight/1080),s=$('#slide');s.style.transform=`scale(${k}) translate(-50%,-50%)`}
addEventListener('resize',fit);
const closeAll=()=>document.querySelectorAll('.overlay').forEach(o=>{o.classList.remove('show')})||($('#yt iframe').src='about:blank');
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName)){if(e.key==='Escape')e.target.blur();return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k==='Escape'){closeAll();return}
  if(document.querySelector('.overlay.show'))return;
  if(SV){if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){chan&&chan.postMessage({cmd:1});e.preventDefault()}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){chan&&chan.postMessage({cmd:-1});e.preventDefault()}return}
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){go(cur+1);e.preventDefault()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){go(cur-1);e.preventDefault()}
  else if(k==='Home')go(1);else if(k==='End')go(N);
  else if(k==='r'||k==='R')toggleReveal();
  else if(k==='f'||k==='F')full();else if(k==='n'||k==='N')notes();else if(k==='g'||k==='G')grid();else if(k==='s'||k==='S')settings();else if(k==='p'||k==='P')openSV();
});
$('#slide').addEventListener('click',e=>{if(pollAt(cur)||e.target.closest('a'))return;const r=$('#slide').getBoundingClientRect();go(cur+((e.clientX-r.left)/r.width<.15?-1:1))});
$('#slide').addEventListener('click',e=>{const a=e.target.closest('a.hot');if(!a)return;const m=a.href.match(/youtu\.be\/([\w-]{6,})|youtube\.com\/watch\?v=([\w-]{6,})/);if(m&&location.protocol!=='file:'){e.preventDefault();const id=m[1]||m[2];$('#yt a').href=a.href;$('#yt iframe').src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0';$('#yt').classList.add('show')}},true);
$('#yt button').onclick=closeAll;
let tx=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});addEventListener('touchend',e=>{if(tx==null||pollAt(cur))return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>60)go(cur+(d<0?1:-1));tx=null});
let idleT;const wake=()=>{document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>{if(!document.querySelector('.overlay.show')&&!$('#bar:hover'))document.body.classList.add('idle')},2600)};
addEventListener('mousemove',wake);addEventListener('touchstart',wake,{passive:true});
function full(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
function notes(){document.body.classList.toggle('notes');setTimeout(fit,230)}
function grid(){const g=$('#grid');if(g.classList.toggle('show')){g.firstElementChild.innerHTML=Array.from({length:N},(_,k)=>k+1).map(i=>`<figure class="${i===cur?'cur':''}" data-i="${i}"><img loading="lazy" src="slides/t-${pad(i)}.jpg" alt=""><figcaption><b>${i}</b> ${pollAt(i)?'● ':''}${esc(DATA.titles[i]||'')}</figcaption></figure>`).join('');g.querySelectorAll('figure').forEach(f=>f.onclick=()=>{closeAll();go(+f.dataset.i)});const c=g.querySelector('.cur');c&&c.scrollIntoView({block:'center'})}}
function openSV(){const u=new URL(location.href);u.searchParams.set('view','speaker');u.searchParams.set('s',S);window.open(u.href,'aidvspeaker','width=1000,height=700')}
$('#bPrev').onclick=()=>go(cur-1);$('#bNext').onclick=()=>go(cur+1);$('#bGrid').onclick=grid;$('#bNotes').onclick=notes;$('#bSV').onclick=openSV;$('#bFull').onclick=full;$('#bSet').onclick=settings;
$('#grid').onclick=e=>{if(e.target.id==='grid')closeAll()};$('#set').onclick=e=>{if(e.target.id==='set')closeAll()};

/* ---------------- settings: session, database, reset, export ---------------- */
function settings(){
  const known=LS.get('aidv.sessions',[]);if(!known.includes(S)){known.push(S);LS.set('aidv.sessions',known)}
  $('#set .box').innerHTML=`<button class="btn x" id="sx">Close ✕</button><h2>Polling settings</h2>
  <p>${DB?(canPhone()?'Phones are connected. Audience link:':'Database set, but open this page from GitHub Pages so phones can reach it.'):'Hand-count mode: results are kept in this browser only.'} ${canPhone()?`<br><code>${esc(voteURL())}</code>`:''}</p>
  <h3>Session (one per talk or venue)</h3><p>Each session keeps its own results. Start a new name for each place you present, or reset the current one. Current: <b>${esc(S)}</b>${known.length>1?' · Earlier: '+known.filter(x=>x!==S).map(x=>`<a href="#" data-s="${esc(x)}" style="color:#9fd8ee">${esc(x)}</a>`).join(', '):''}</p>
  <div class="row"><input id="sName" value="${esc(S)}" placeholder="e.g. taipei-nov18"><button class="btn" id="sGo">Use this session</button></div>
  <h3>Results</h3><div class="row"><button class="btn" id="sCsv">Download results (CSV)</button><button class="btn warn" id="sRst">Reset ALL results in “${esc(S)}”</button></div><div class="msg" id="sMsg"></div>
  <h3>Phone voting database</h3><p>Paste your Firebase Realtime Database URL (setup steps are in README.md). Leave empty for hand-count mode.</p>
  <div class="row"><input id="sDb" value="${esc(DB)}" placeholder="https://your-project-default-rtdb.firebaseio.com"><button class="btn" id="sDbGo">Save and test</button></div><div class="msg" id="dMsg"></div>
  <h3>Keys</h3><p>→ / Space / clicker: next · ←: back · R: show or hide results · G: all slides · N: notes · P: speaker view · F: full screen · S: this panel · Esc: close</p>`;
  $('#set').classList.add('show');$('#sx').onclick=closeAll;
  const sw=n=>{n=clean(n);if(!n)return;S=n;LS.set('aidv.session',S);const u=new URL(location.href);u.searchParams.set('s',S);history.replaceState(null,'',u.href);revealed={};tree={};refresh().then(()=>{build();settings()})};
  $('#sGo').onclick=()=>sw($('#sName').value);
  document.querySelectorAll('#set a[data-s]').forEach(a=>a.onclick=e=>{e.preventDefault();sw(a.dataset.s)});
  $('#sCsv').onclick=csv;
  $('#sRst').onclick=function(){if(!this.dataset.arm){this.dataset.arm=1;this.textContent='Click again to erase everything in “'+S+'”';return}resetAll();delete this.dataset.arm;this.textContent='Reset ALL results in “'+S+'”';$('#sMsg').textContent='All results in this session were erased. Phones can vote again.'};
  $('#sDbGo').onclick=async()=>{DB=normDb($('#sDb').value);LS.set('aidv.db',DB);tally=!DB;const m=$('#dMsg');if(!DB){m.textContent='Hand-count mode.';await refresh();build();return}m.textContent='Testing…';try{const k='test/'+rid();await req(k,'PUT',1);await req(k,'DELETE');m.innerHTML='<span style="color:#3ddc84">Connected. Reading and writing both work.</span>';setStat(true)}catch(e){m.innerHTML='<span style="color:#ff8a80">Could not read/write ('+esc(e.message)+'). Check the URL and that the database rules from README.md are published.</span>';setStat(false)}await refresh();build()};
}
function csv(){const rows=[['session','poll','question','option','count','percent of responses']];
  POLLS.filter(p=>p.type==='poll').forEach(p=>p.qs.forEach(q=>{const v=(tree.votes||{})[q.id]||{},n=q.opts.map(()=>0);Object.values(v).forEach(i=>{if(n[i]!==undefined)n[i]++});const t=n.reduce((a,b)=>a+b,0);q.opts.forEach((o,i)=>rows.push([S,p.title,q.q,o[0]+' '+o[1],n[i],t?(n[i]/t*100).toFixed(1):'']))}));
  Object.values(tree.words||{}).forEach(w=>rows.push([S,'Your Concerns','Biggest concern',w,1,'']));
  Object.values(tree.qa||{}).forEach(q=>q&&q.t&&rows.push([S,'Q&A','Audience question',q.t,1,'']));
  const txt='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download=`ai-divide-polls-${S}.csv`;a.click()}

/* ---------------- speaker view window ---------------- */
let t0=Date.now();
function svPaint(){$('#svt').textContent=`Slide ${cur} of ${N} · ${DATA.titles[cur]||''}`;$('#svn').textContent=DATA.notes[cur]||'(no notes)';$('#svn').scrollTop=0;$('#svi1').src=`slides/t-${pad(cur)}.jpg`;const n=$('#svi2');if(cur<N){n.src=`slides/t-${pad(cur+1)}.jpg`;n.style.visibility=''}else n.style.visibility='hidden'}
if(chan)chan.onmessage=e=>{const d=e.data||{};if(SV){if(d.i){cur=d.i;svPaint()}}else{if(d.cmd)go(cur+d.cmd);if(d.hello)chan.postMessage({i:cur})}};
if(SV){document.body.classList.add('sv');document.title='Speaker view';setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#svc').textContent=pad(Math.floor(s/60))+':'+pad(s%60)},500);$('#svr').onclick=()=>{t0=Date.now()};chan&&chan.postMessage({hello:1})}

addEventListener('hashchange',()=>{const i=+location.hash.slice(1);if(i&&i!==cur)go(i)});
fit();setStat(DB?true:null);
(async()=>{await refresh();go(+location.hash.slice(1)||1,true);wake()})();
</script>
